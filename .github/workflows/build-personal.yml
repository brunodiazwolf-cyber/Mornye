name: Build Personal APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MORNYE_DISCORD_SDK: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Prepare Flutter project
        run: |
          dart scripts/prepare_flutter_sdk.dart
          flutter pub get
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Build Lite APK (arm64 only)
        env:
          MORNYE_RUST_ANDROID_ABIS: arm64-v8a
        run: bash scripts/build_android.sh --lite --target lib/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mornye-personal-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
